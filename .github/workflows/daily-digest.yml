name: daily-digest

on:
  schedule:
    # 09:00 UTC = 10:00 in Portugal summer (UTC+1), 09:00 in winter.
    # Adjust as you like (GitHub cron runs in UTC).
    - cron: "0 9 * * *"
  workflow_dispatch: {} # lets you hit "Run workflow" manually to test

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily scan + ntfy push
        env:
          NTFY_ENABLED: "1"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m bettingbot.daily_digest --offset 0
        working-directory: src